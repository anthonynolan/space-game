<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starline Run</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(7, 12, 22, 0.72);
        --line: rgba(255, 255, 255, 0.18);
        --text: #f4f7fb;
        --muted: #aeb8c8;
        --accent: #7ce7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050915;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        inset: env(safe-area-inset-top) 0 auto 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
        pointer-events: none;
      }

      .controls {
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }

      .stat,
      .button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(12px);
      }

      .stat {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 8px;
        align-items: center;
        padding: 7px 11px;
        font-weight: 700;
      }

      .stat span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .stat strong {
        min-width: 54px;
        text-align: right;
        font-size: 18px;
        line-height: 1;
      }

      .button {
        display: inline-grid;
        place-items: center;
        width: 44px;
        padding: 0;
        color: var(--text);
        pointer-events: auto;
        cursor: pointer;
      }

      .button svg {
        width: 21px;
        height: 21px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: linear-gradient(rgba(5, 9, 21, 0.34), rgba(5, 9, 21, 0.54));
        pointer-events: auto;
      }

      .overlay[hidden] {
        display: none;
      }

      .dialog {
        width: min(420px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
        background: rgba(7, 12, 22, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(30px, 10vw, 46px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .primary {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #041018;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      @media (max-width: 520px) {
        .hud {
          padding-top: 10px;
        }

        .stat {
          min-height: 38px;
        }

        .stat strong {
          min-width: 48px;
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Side-scrolling spaceship game"></canvas>

    <div class="hud">
      <div class="stat" aria-live="polite">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="controls">
        <button class="button" id="fire" type="button" aria-label="Fire laser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M4 12h13" />
            <path d="m13 7 5 5-5 5" />
            <path d="M4 8v8" />
          </svg>
        </button>
        <button class="button" id="pause" type="button" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M8 5v14M16 5v14" />
          </svg>
        </button>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="dialog">
        <h1>Starline Run</h1>
        <p id="message">Drag anywhere to guide the ship through the canyon. Tap the arrow button or press X to fire.</p>
        <button class="primary" id="start" type="button">Start</button>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
