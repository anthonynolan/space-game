<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starline Run</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Side-scrolling spaceship game"></canvas>

    <div class="hud">
      <div class="stat" aria-live="polite">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="controls">
        <button class="button" id="bomb" type="button" aria-label="Drop bomb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M12 4v10" />
            <path d="m8 10 4 4 4-4" />
            <path d="M6 20h12" />
          </svg>
        </button>
        <button class="button" id="fire" type="button" aria-label="Fire laser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M4 12h13" />
            <path d="m13 7 5 5-5 5" />
            <path d="M4 8v8" />
          </svg>
        </button>
        <button class="button" id="pause" type="button" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M8 5v14M16 5v14" />
          </svg>
        </button>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="dialog">
        <h1>Starline Run</h1>
        <p id="message">Drag anywhere to guide the ship. Tap arrow to fire, down arrow to bomb. Keyboard: X fires, Z bombs.</p>
        <section class="player-panel" aria-label="Player selection">
          <div class="panel-heading">
            <span>Player</span>
            <strong id="current-player">No player selected</strong>
          </div>
          <div class="player-list" id="player-list"></div>
          <form class="name-form" id="name-form" autocomplete="off">
            <input id="player-name" name="player-name" type="text" maxlength="18" placeholder="New player name" />
            <button type="submit">Add</button>
          </form>
        </section>
        <section class="leaderboard" aria-label="Leaderboard">
          <div class="panel-heading">
            <span>Leaderboard</span>
            <strong>Top 10 runs</strong>
          </div>
          <ol id="leaderboard-list"></ol>
        </section>
        <button class="primary" id="start" type="button">Start</button>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
